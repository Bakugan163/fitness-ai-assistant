spring:
  application:
    name: fitness-ai-assistant

  # Отключаем Docker Compose
  docker:
    compose:
      enabled: false

  # Настройки H2 (в памяти)
  datasource:
    url: jdbc:h2:mem:fitnessdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # НОВЫЙ БЛОК: Включаем веб-консоль H2
  h2:
    console:
      enabled: true        # Включает консоль
      path: /h2-console    # Задает адрес, по которому она будет доступна
      settings:
        web-allow-others: false # Разрешаем доступ только с локального компьютера

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  # Отключаем Flyway
  flyway:
    enabled: false

server:
  port: 8080