spring:
  application:
    name: fitness-ai-assistant

  # Отключаем Docker Compose
  docker:
    compose:
      enabled: false

  # Настройки H2 (в памяти)
  datasource:
    url: jdbc:h2:file:./data/fitnessdb;MODE=PostgreSQL;AUTO_SERVER=TRUE1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # НОВЫЙ БЛОК: Включаем веб-консоль H2
  h2:
    console:
      enabled: true        # Включает консоль
      path: /h2-console    # Задает адрес, по которому она будет доступна
      settings:
        web-allow-others: false # Разрешаем доступ только с локального компьютера

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  # Отключаем Flyway
  flyway:
    enabled: false

server:
  port: 8080

app:
  jwt:
    # Секретный ключ (должен быть длинным, в base64)
    # Я сгенерировал случайный ключ специально для твоего проекта
    secret: "4A614E645267556B58703273357638792F423F4528482B4D6251655468576D5A"
    # Время жизни токена в миллисекундах (86400000 = 24 часа)
    expirationMs: 86400000

logging:
  level:
    org.springframework.security: TRACE